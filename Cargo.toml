[package]
name = "secret-protection-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Memory pages for secrets that stay out of swap, core dumps and child processes, wiped when dropped, and the isolation of a process against a secret leaving it"
license = "MIT OR Apache-2.0"
# Not published while the interface is a draft.
publish = false

[dependencies]
# Wiping secret bytes with writes the compiler keeps.
zeroize = "=1.9.1"

# Pages, locking, advice to the kernel, the core-dump limit, seccomp, Landlock and the sandbox.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

# The Landlock layer, written by the Landlock project: every right of each ABI, and what an older
# kernel leaves out.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.7"

# Pages, locking and the working set, error-report exclusion, the access lists of the process and
# its threads, token integrity and console output.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Memory",
  "Win32_System_ErrorReporting",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }

# The tests read the working set of the secret pages (QueryWorkingSetEx).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_ProcessStatus"] }

# A `main` of their own: the isolation needs a child process of one thread, and the counting
# allocator a process without other threads.
[[test]]
name = "isolation"
harness = false

[[test]]
name = "secret_memory"
harness = false

[lints.rust]
unsafe_code = "deny" # "deny", not "forbid": the operating-system modules allow it (RUST-07)
missing_docs = "deny"
unreachable_pub = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny" # at 150 lines, CORE-15
mod_module_files = "deny" # RUST-03
undocumented_unsafe_blocks = "deny" # RUST-07
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.test]
opt-level = 2
