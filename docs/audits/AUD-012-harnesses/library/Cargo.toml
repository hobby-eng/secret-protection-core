[package]
name = "secret-protection-core-aud-012-library"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
libc = "=0.2.191"

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny"
mod_module_files = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
