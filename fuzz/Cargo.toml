[package]
name = "secret-protection-core-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
secret-protection-core = { path = ".." }

# The text a worker finds in its setting variable, which whoever starts the program writes.
[[bin]]
name = "setting"
path = "fuzz_targets/setting.rs"
test = false
doc = false
bench = false

# The bytes a parent reads as its worker's report.
[[bin]]
name = "report"
path = "fuzz_targets/report.rs"
test = false
doc = false
bench = false

# The keys a window sends to the worker for a secret field.
[[bin]]
name = "keystrokes"
path = "fuzz_targets/keystrokes.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_code = "forbid"

# A fuzz target answers by stopping the run: its unwraps and assertions are its checks, so the
# lints against them are left out of the table (RUST-01).
[lints.clippy]
all = { level = "deny", priority = -1 }
too_many_lines = "deny"
mod_module_files = "deny"
undocumented_unsafe_blocks = "deny"

# Its own workspace: the crate under test stays a crate without one.
[workspace]
