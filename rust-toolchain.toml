[toolchain]
channel = "1.99.1"
profile = "minimal"
# The browser build, every system this crate has code for (desktop and mobile), and a 32-bit
# Linux without this crate's seccomp filter, for clippy.
targets = [
  "wasm32-unknown-unknown",
  "x86_64-pc-windows-gnu",
  "aarch64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-linux-android",
  "armv5te-unknown-linux-gnueabi",
]
components = ["rustfmt", "clippy"]
