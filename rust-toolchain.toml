[toolchain]
channel = "1.99.1"
profile = "minimal"
# The browser build, every system this crate supports (macOS on Apple silicon and on Intel, Windows
# with GNU, mobile), and two 32-bit Linux targets kept as tests, not as supported platforms:
# ARMv5 for clippy on Linux without this crate's seccomp filter, and i686, whose tests CI runs on
# its x86-64 runner for the 32-bit sizes.
targets = [
  "wasm32-unknown-unknown",
  "i686-unknown-linux-gnu",
  "x86_64-pc-windows-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-linux-android",
  "armv5te-unknown-linux-gnueabi",
]
components = ["rustfmt", "clippy"]
