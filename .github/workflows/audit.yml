name: RustSec audit

# Check both the library and fuzz lockfiles against RustSec when dependencies change and once a week.
on:
  # Branches only, as for CI: a release tag adds nothing to check.
  push:
    branches: ["**"]
    paths:
      - Cargo.toml
      - Cargo.lock
      - fuzz/Cargo.toml
      - fuzz/Cargo.lock
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - fuzz/Cargo.toml
      - fuzz/Cargo.lock
      - .github/workflows/audit.yml
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
  # The release workflow audits the tag before it packages anything.
  workflow_call:

concurrency:
  group: rustsec-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    strategy:
      matrix:
        lockfile: [Cargo.lock, fuzz/Cargo.lock, wasm/Cargo.lock]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit Cargo.lock against RustSec
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          createIssues: false
          file: ${{ matrix.lockfile }}
