name: CI

# The fast checks (CI-04): the formatting, the lints of every system the crate has code for, and
# the tests on each system that runs them natively.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the same checks on the tag before it packages anything.
  workflow_call:

# A newer push to the same branch or pull request makes a running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The formatting, the lints of the host and of every target of rust-toolchain.toml, and the
  # tests on x86-64 Linux.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DPRINT: "0.63.0"
      DPRINT_SHA256: f58b5d7c13ccd613cfa264f1ae82d4e5db1373f8fe20462bc1126051d111b0ce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      # dprint formats the Markdown, JSON, TOML and YAML; dprint.json pins its plugins with their
      # SHA-256.
      - name: Install dprint, checked against its SHA-256
        run: |
          archive="dprint-x86_64-unknown-linux-gnu.zip"
          curl --fail --silent --show-error --location --proto '=https' \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/dprint/dprint/releases/download/$DPRINT/$archive"
          echo "$DPRINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/dprint"
          echo "$RUNNER_TEMP/dprint" >> "$GITHUB_PATH"
      - name: Check the formatting
        run: |
          cargo fmt --check
          cargo fmt --manifest-path fuzz/Cargo.toml --check
          dprint check
      # The notices name exactly the packages of the library's dependency tree, each with its
      # complete version: both lists of "name vVERSION" pairs must be equal.
      - name: Check the third-party notices against the dependency tree
        run: |
          tree=$(cargo tree --locked --target all --edges normal,build --prefix none --format '{p}' | sed 's/ (.*//' | grep -v '^secret-protection-core ' | sort -u)
          notices=$(grep -oE '\*\*[a-z0-9_-]+ [0-9][^*]*\*\*' THIRD_PARTY_NOTICES.md | while read -r span; do
            span=${span#\*\*}
            span=${span%\*\*}
            for token in ${span#* }; do
              if [[ $token =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
                echo "${span%% *} v$token"
              fi
            done
          done | sort -u)
          diff <(echo "$tree") <(echo "$notices") ||
            { echo "THIRD_PARTY_NOTICES.md and the dependency tree differ: < only in the tree, > only in the notices"; exit 1; }
      - name: Lint the fuzz targets
        run: RUSTFLAGS="--cfg fuzzing" cargo clippy --locked --manifest-path fuzz/Cargo.toml --bins -- -D warnings
      - name: Lint the host and every target
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          targets=$(sed -n 's/^  "\(.*\)",$/\1/p' rust-toolchain.toml)
          test -n "$targets"
          for target in $targets; do
            cargo clippy --locked --all-targets --target "$target" -- -D warnings
          done
      - name: Run the tests
        run: cargo test --locked --no-fail-fast
      # Clearing the stack depends on how the compiler lays out frames: its tests run in the
      # release profile too, as the library ships.
      - name: Run the stack-clearing tests in the release profile
        run: "cargo test --locked --release --lib stack::"
      # Last, as it changes the runner: while Yama lets any process of the user attach, no worker
      # may start.
      - name: Run the worker tests with Yama's ptrace_scope at 0
        run: |
          sudo sysctl -w kernel.yama.ptrace_scope=0
          cargo test --locked --no-fail-fast --test worker

  # The tests on each other system the crate runs on natively. Code for one system alone is
  # compiled only there, so warnings fail the job. macos-15-intel is the Intel macOS runner this
  # workflow uses; GitHub lists the Intel runners it still offers at
  # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
  # On Windows both toolchains run the tests: MSVC, and GNU, which links with MinGW.
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
          - os: macos-latest
          - os: macos-15-intel
          - os: windows-latest
          - os: windows-latest
            target: x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      # A worker runs in a less privileged AppContainer, which starts only a program file that
      # ALL RESTRICTED APPLICATION PACKAGES may read and run, as the files under Program Files are.
      - name: Let restricted application packages read and run the test programs
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force target | Out-Null
          icacls target /grant "*S-1-15-2-2:(OI)(CI)RX"
      - name: Run the tests
        run: cargo test --locked --no-fail-fast ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Run the stack-clearing tests in the release profile
        run: "cargo test --locked --release --lib ${{ matrix.target && format('--target {0}', matrix.target) || '' }} stack::"
      # macOS confirms NoMemoryReading only under the hardened runtime: the isolation and worker
      # programs again, ad hoc signed with it.
      - name: Run the isolation and worker tests under the hardened runtime
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          for test in isolation worker; do
            binary=$(cargo test --locked --no-run --test "$test" --message-format=json \
              | jq -r 'select(.executable != null) | .executable')
            codesign --sign - --force --options runtime "$binary"
            SECRET_PROTECTION_CORE_TEST_HARDENED=1 "$binary"
          done

  # The WebAssembly build has no test runner: wasm/ builds a module of checks, which Node runs.
  # Heap buffers, input encoding, and Unsupported from everything that needs processes, stacks or
  # channels.
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - name: Format-check, lint and build the WebAssembly checks
        run: |
          cargo fmt --manifest-path wasm/Cargo.toml --check
          cargo clippy --locked --manifest-path wasm/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
          cargo build --locked --release --manifest-path wasm/Cargo.toml --target wasm32-unknown-unknown
      - name: Run the WebAssembly checks in Node
        run: node wasm/run.mjs wasm/target/wasm32-unknown-unknown/release/secret_protection_core_wasm_checks.wasm

  # The tests on 32-bit Linux, whose pointers and sizes are half as wide, on the x86-64 runner with
  # the 32-bit C library. This crate has no seccomp filter there.
  linux-32:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Install the 32-bit C library
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends gcc-multilib
      - name: Run the tests
        run: cargo test --locked --no-fail-fast --target i686-unknown-linux-gnu
      - name: Run the stack-clearing tests in the release profile
        run: "cargo test --locked --release --target i686-unknown-linux-gnu --lib stack::"
