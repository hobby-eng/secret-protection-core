name: Release provenance

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The package is made only from a tag that passes, on that commit, the checks and tests of every
  # system, the RustSec audit and the three sanitizer-backed fuzz targets.
  checks:
    uses: ./.github/workflows/ci.yml

  audit:
    uses: ./.github/workflows/audit.yml

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-11-13 --profile minimal
          cargo +nightly-2026-11-13 install cargo-fuzz --locked --version 0.13.2
      - name: Run the three fuzz targets
        run: |
          set -euo pipefail
          # The fuzz workspace's own lockfile, unchanged: cargo-fuzz has no --locked of its own.
          cargo +nightly-2026-11-13 fetch --locked --manifest-path fuzz/Cargo.toml
          for target in setting report keystrokes; do
            cargo +nightly-2026-11-13 fuzz run --fuzz-dir fuzz --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=90
          done
          # cargo-fuzz could have resolved anew: the results count only for the checked-in graph.
          git diff --exit-code -- fuzz/Cargo.lock

  package:
    needs: [checks, audit, fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package the tagged crate and verify its build
        run: |
          set -euo pipefail
          version="$(cargo pkgid --locked | sed 's/.*[#@]//')"
          test "$GITHUB_REF_NAME" = "v$version"
          cargo package --locked
          crate="secret-protection-core-$version.crate"
          mkdir release
          cp "target/package/$crate" release/
          cd release
          sha256sum "$crate" > SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: release/
          if-no-files-found: error

  attest:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: release

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "release/*.crate"
